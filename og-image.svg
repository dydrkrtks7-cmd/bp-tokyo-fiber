<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c2185b"/>
      <stop offset="100%" stop-color="#e91e63"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fff3e0"/>
      <stop offset="100%" stop-color="#e91e63"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Geometric pattern -->
  <circle cx="40" cy="223" r="21" fill="#e91e63" opacity="0.07"/>
    <circle cx="909" cy="351" r="24" fill="#e91e63" opacity="0.09"/>
    <circle cx="1149" cy="-56" r="51" fill="#e91e63" opacity="0.13"/>
    <circle cx="19" cy="519" r="39" fill="#e91e63" opacity="0.05"/>
    <circle cx="82" cy="-52" r="72" fill="#e91e63" opacity="0.12"/>
    <circle cx="71" cy="257" r="66" fill="#e91e63" opacity="0.19"/>
    <rect x="484" y="113" width="22" height="78" rx="8" fill="#c2185b" opacity="0.10" transform="rotate(9, 899, 634)"/>
    <rect x="965" y="654" width="63" height="64" rx="8" fill="#c2185b" opacity="0.09" transform="rotate(7, 513, 253)"/>
    <rect x="611" y="-54" width="21" height="81" rx="8" fill="#c2185b" opacity="0.06" transform="rotate(20, 1006, 501)"/>
    <rect x="-68" y="520" width="40" height="24" rx="8" fill="#c2185b" opacity="0.06" transform="rotate(12, 179, 649)"/>
    <rect x="953" y="326" width="59" height="46" rx="8" fill="#c2185b" opacity="0.13" transform="rotate(24, 918, 118)"/>
    <rect x="571" y="316" width="55" height="76" rx="8" fill="#c2185b" opacity="0.04" transform="rotate(2, 1083, 615)"/>
    <rect x="316" y="74" width="28" height="79" rx="8" fill="#c2185b" opacity="0.05" transform="rotate(41, 647, 722)"/>
    <rect x="-62" y="195" width="61" height="68" rx="8" fill="#c2185b" opacity="0.13" transform="rotate(12, 1145, 602)"/>
    <polygon points="424,477 507,643 341,643" fill="#e91e63" opacity="0.06"/>
    <polygon points="1227,-90 1305,66 1149,66" fill="#e91e63" opacity="0.08"/>
    <polygon points="162,529 211,627 113,627" fill="#e91e63" opacity="0.12"/>
    <polygon points="589,108 615,160 563,160" fill="#e91e63" opacity="0.07"/>

  <!-- Wave at bottom -->
  <path d="M0,544 C360,587 840,501 1200,544 L1200,630 L0,630Z" fill="#e91e63" opacity="0.3"/>

  <!-- 중앙 텍스트 카드 -->
  <rect x="80" y="195" width="1040" height="260" rx="20" fill="rgba(0,0,0,0.35)" filter="url(#blur-bg)"/>
  <filter id="blur-bg"><feGaussianBlur stdDeviation="8"/></filter>

  <text x="600" y="270" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="2">
    구글 인덱싱 속도 초고속 광회선 대역폭 최적화
  </text>
  <text x="600" y="330" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="22" font-weight="400" fill="rgba(255,255,255,0.85)">
     — 크롤 가속화
  </text>

  <!-- Accent line -->
  <line x1="450" y1="355" x2="750" y2="355" stroke="#fff3e0" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- 하단 CTA -->
  <rect x="440" y="385" width="320" height="40" rx="20" fill="#fff3e0" opacity="0.9"/>
  <text x="600" y="411" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="16" font-weight="600" fill="#ffffff">
    ▼ 자세히 보기
  </text>

  <!-- 상단 브랜드 -->
  <text x="60" y="55" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,0.6)">
     구글 인덱싱 속도 초고속 광회선 대역폭 최적화 — 크롤 가속화
  </text>
</svg>